<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loterias App — Quina, Mega-Sena, Lotofácil e Lotomania</title>
    <meta name="description" content="Ferramenta gratuita de análise, estatísticas e jogos estratégicos para loterias brasileiras.">
    
    <!-- Código AdSense — Completo e Correto -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9632309607215098" crossorigin="anonymous"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1e3a8a, #3b82f6);
            min-height: 100vh;
            padding: 20px 16px;
        }

        .container {
            max-width: 420px;
            margin: 0 auto;
        }

        h1 {
            color: white;
            text-align: center;
            font-size: 22px;
            margin-bottom: 30px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 30px 24px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.15);
        }

        .card h2 {
            text-align: center;
            color: #1e3a8a;
            font-size: 20px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #374151;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 15px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #3b82f6;
        }

        .btn {
            width: 100%;
            padding: 16px;
            background: #16a34a;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn:hover {
            background: #15803d;
        }

        .aviso {
            text-align: center;
            margin-top: 20px;
            color: white;
            font-size: 14px;
            line-height: 1.5;
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎰 Loterias App — Quina • Mega • Loto • Mania</h1>
        
        <div class="card">
            <h2>🔐 Entrar / Cadastrar</h2>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="nome">Nome Completo</label>
                    <input type="text" id="nome" placeholder="Digite seu nome completo" required>
                </div>

                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="seu@email.com" required>
                </div>

                <div class="form-group">
                    <label for="senha">Senha (mínimo 6 caracteres)</label>
                    <input type="password" id="senha" placeholder="••••••••" required minlength="6">
                </div>

                <button type="submit" class="btn">
                    ✅ Entrar / Criar Conta
                </button>
            </form>
        </div>

        <p class="aviso">Ao entrar, você confirma ser maior de 18 anos e joga com responsabilidade.</p>
    </div>

    <script>
        // Funcionalidade do formulário
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const nome = document.getElementById('nome').value;
            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;

            if (senha.length < 6) {
                alert('A senha deve ter no mínimo 6 caracteres!');
                return;
            }

            // Salva os dados no navegador
            localStorage.setItem('usuarioNome', nome);
            localStorage.setItem('usuarioEmail', email);

            alert(`Bem-vindo, ${nome}! Conta criada com sucesso! 🎉`);
            
            // Aqui você pode redirecionar para a página principal
             window.location.href = '/';
            
        });
    </script>
</body>
</html>
